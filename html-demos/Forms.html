<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <input type="text" placeholder="First Name" maxlength="10" required pattern="[a-zA-Z]{3,10}">
        <input type="password" placeholder="Password">
        <input type="datetime-local">
        <input type="color">
        <input type="checkbox"/>Singing
        <input type="checkbox"/>Dancing
        <input type="checkbox"/>Reading
        <input type="radio" name="gender"/> Male
        <input type="radio" name="gender"/> Female
        <input type="radio" name="gender"/> Transgender
        <!-- <select multiple> -->
        <select>
            <option>India</option>
            <option>China</option>
            <option>Japan</option>
            <option>Russia</option>
        </select>
        <textarea cols="50" rows="5" placeholder="Your Feedback"></textarea>
        <!-- <input type="submit" value="Submit"> -->
         <button type="submit">Submit</button>
    </form>
</body>
</html>
