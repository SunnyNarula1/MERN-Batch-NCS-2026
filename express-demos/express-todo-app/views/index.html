<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="mt-3 px-4 py-4 text-center bg-primary text-light rounded-3">
                    <h2>Todo List Manager</h2>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6 offset-md-3">
                <form method="post" action="/add">
                    <div class="input-group mb-3">
                        <input type="text" name="text" class="form-control" placeholder="Enter Your Text">
                        <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Add</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6 offset-md-3">
                <ul class="list-group">
                    <% todos.forEach(function(todo) { %>
                        <li class="list-group-item">
                            <form method="post" action="/delete/<%= todo.id %>">
                                <%=todo.text%> <button class="btn btn-danger btn-sm float-end">X</button>
                            </form>
                        </li>
                        <%})%>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
