<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="script.js"></script>
</head>

<body>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="bg-primary py-4 px-4 rounded-4">
                    <h1 class="text-light text-center">Todo List</h1>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6 offset-md-3">
                <div class="input-group mb-3">
                    <input id="textItem" type="text" class="form-control" placeholder="Enter Your Text">
                    <button type="button" onclick="AddItem()" class="input-group-text">Add</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <ul id="todoList" class="list-group">
                    
                </ul>
            </div>
        </div>
    </div>

</body>

</html>
