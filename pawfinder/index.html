<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawFinder</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
          <div>
            <p class="eyebrow mb-1">Happy Tails Shelter</p>
            <h1 class="mb-0">PawFinder</h1>
          </div>
          <button id="resetFormButton" type="button" class="btn btn-outline-secondary">
            Reset form
          </button>
        </div>

        <div class="summary-bar row g-3 text-center">
          <div class="col-4">
            <div class="summary-card">
              <span class="summary-label">Total</span>
              <strong id="totalCount">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div class="summary-card accent-success">
              <span class="summary-label">Available</span>
              <strong id="availableCount">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div class="summary-card accent-danger">
              <span class="summary-label">Adopted</span>
              <strong id="adoptedCount">0</strong>
            </div>
          </div>
        </div>
      </header>

      <main class="row g-4">
        <aside class="col-lg-4">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
              <h2 id="formTitle" class="h4 mb-3">Register a new animal</h2>

              <form id="animalForm" novalidate>
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input id="name" name="name" type="text" class="form-control" />
                  <div class="invalid-feedback d-block" data-error-for="name"></div>
                </div>

                <div class="mb-3">
                  <label for="species" class="form-label">Species</label>
                  <select id="species" name="species" class="form-select">
                    <option value="">Choose species</option>
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Other">Other</option>
                  </select>
                  <div class="invalid-feedback d-block" data-error-for="species"></div>
                </div>

                <div class="mb-3">
                  <label for="breed" class="form-label">Breed</label>
                  <input id="breed" name="breed" type="text" class="form-control" />
                  <div class="invalid-feedback d-block" data-error-for="breed"></div>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="age" class="form-label">Age</label>
                      <input id="age" name="age" type="number" min="0" step="1" class="form-control" />
                      <div class="invalid-feedback d-block" data-error-for="age"></div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="gender" class="form-label">Gender</label>
                      <select id="gender" name="gender" class="form-select">
                        <option value="">Choose</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                      <div class="invalid-feedback d-block" data-error-for="gender"></div>
                    </div>
                  </div>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="arrivalDate" class="form-label">Arrival date</label>
                      <input id="arrivalDate" name="arrivalDate" type="date" class="form-control" />
                      <div class="invalid-feedback d-block" data-error-for="arrivalDate"></div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="status" class="form-label">Status</label>
                      <select id="status" name="status" class="form-select">
                        <option value="Available">Available</option>
                        <option value="Adopted">Adopted</option>
                      </select>
                      <div class="invalid-feedback d-block" data-error-for="status"></div>
                    </div>
                  </div>
                </div>

                <div class="mb-3 form-check form-switch">
                  <input id="vaccinated" name="vaccinated" class="form-check-input" type="checkbox" />
                  <label class="form-check-label" for="vaccinated">Vaccinated</label>
                </div>

                <div class="mb-3">
                  <label for="notes" class="form-label">Notes</label>
                  <textarea id="notes" name="notes" rows="3" class="form-control"></textarea>
                  <div class="invalid-feedback d-block" data-error-for="notes"></div>
                </div>

                <div class="mb-3">
                  <label for="photoUrl" class="form-label">Photo URL</label>
                  <input id="photoUrl" name="photoUrl" type="url" class="form-control" />
                  <div class="invalid-feedback d-block" data-error-for="photoUrl"></div>
                </div>

                <button id="submitButton" type="submit" class="btn btn-primary w-100">
                  Add animal
                </button>
              </form>
            </div>
          </div>
        </aside>

        <section class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="row g-3 align-items-end mb-3">
                <div class="col-md-5">
                  <label for="searchInput" class="form-label">Search</label>
                  <input id="searchInput" type="search" class="form-control" placeholder="Search by name or breed" />
                </div>

                <div class="col-md-3">
                  <label for="speciesFilter" class="form-label">Species</label>
                  <select id="speciesFilter" class="form-select">
                    <option value="All">All</option>
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="col-md-2">
                  <label for="statusFilter" class="form-label">Status</label>
                  <select id="statusFilter" class="form-select">
                    <option value="All">All</option>
                    <option value="Available">Available</option>
                    <option value="Adopted">Adopted</option>
                  </select>
                </div>

                <div class="col-md-2">
                  <label for="sortSelect" class="form-label">Sort</label>
                  <select id="sortSelect" class="form-select">
                    <option value="name-asc">Name A-Z</option>
                    <option value="age-asc">Age ↑</option>
                    <option value="age-desc">Age ↓</option>
                  </select>
                </div>
              </div>

              <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
              <div id="emptyState" class="alert alert-info d-none" role="alert">
                No animals match the current filters.
              </div>

              <div id="animalsContainer" class="row g-3"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
